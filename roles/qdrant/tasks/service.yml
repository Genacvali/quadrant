---
# Запуск/рестарт сервиса. Первый узел стартует первым (в кластере он инициализирует консенсус),
# остальные узлы подключаются к нему по одному.
# При провале health-check выводится состояние сервиса и хвост журнала, чтобы причина была видна в логе плейбука.

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: not ansible_check_mode

- name: Start qdrant on the first node
  when:
    - qdrant_is_first_node
    - not ansible_check_mode
  block:
    - name: Enable and start qdrant service on the first node
      ansible.builtin.systemd:
        name: qdrant
        enabled: true
        state: "{{ 'restarted' if (qdrant_restart_required | default(false) | bool) else 'started' }}"

    - name: Wait for qdrant to start on the first node
      ansible.builtin.uri:
        url: "{{ qdrant_api_scheme }}://{{ qdrant_host }}:{{ qdrant_http_port }}/healthz"
        method: GET
        timeout: 30
        validate_certs: false
        headers:
          api-key: "{{ qdrant_api_key }}"
      register: qdrant_health
      retries: "{{ qdrant_healthcheck_retries }}"
      delay: "{{ qdrant_healthcheck_delay }}"
      until: qdrant_health.status == 200
  rescue:
    - name: Collect qdrant diagnostics
      ansible.builtin.import_tasks: service_diag.yml

- name: Start qdrant on the other nodes
  when:
    - not qdrant_is_first_node
    - not ansible_check_mode
  block:
    - name: Enable and start qdrant service on the other nodes
      ansible.builtin.systemd:
        name: qdrant
        enabled: true
        state: "{{ 'restarted' if (qdrant_restart_required | default(false) | bool) else 'started' }}"
      throttle: 1

    - name: Wait for qdrant to start on the other nodes
      ansible.builtin.uri:
        url: "{{ qdrant_api_scheme }}://{{ qdrant_host }}:{{ qdrant_http_port }}/healthz"
        method: GET
        timeout: 30
        validate_certs: false
        headers:
          api-key: "{{ qdrant_api_key }}"
      register: qdrant_health
      retries: "{{ qdrant_healthcheck_retries }}"
      delay: "{{ qdrant_healthcheck_delay }}"
      until: qdrant_health.status == 200
  rescue:
    - name: Collect qdrant diagnostics
      ansible.builtin.import_tasks: service_diag.yml

- name: Verify cluster health
  ansible.builtin.uri:
    url: "{{ qdrant_api_scheme }}://{{ qdrant_host }}:{{ qdrant_http_port }}/cluster"
    method: GET
    timeout: 30
    validate_certs: false
    headers:
      api-key: "{{ qdrant_api_key }}"
  register: cluster_info
  retries: 10
  delay: 3
  until: cluster_info.status == 200
  when:
    - qdrant_cluster_enabled
    - not ansible_check_mode
